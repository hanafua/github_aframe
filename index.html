<!DOCTYPE html> 
 
<html> 
 
<head> 
 
  <meta charset="utf-8"> 
 
  <title>My A-Frame World</title> 
 
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script> 
  <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
 
</head> 
 
<body> 
 
  <a-scene> 
 
    <a-box 
      position="0 1 -3" 
      color=" #e83a74">
    </a-box> 
 
    <a-plane 
      position="0 0.1 -4" 
      rotation="-90 0 0" 
      width="10" 
      
      height="10" 
      color="#ff6a00"> 
    </a-plane> 
 
    <a-sky color="#18102e">
    </a-sky> 
 
    <a-entity environment="preset: forest;" skyColor="#271642;"></a-entity>

  </a-scene> 
 
</body> 
 
</html>
